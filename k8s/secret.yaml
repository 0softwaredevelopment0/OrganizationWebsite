apiVersion: v1
kind: Secret
metadata:
  name: rizer001-env
  namespace: rizer001-site
type: Opaque
stringData:
  # Paste your .env values here before applying, or use:
  #   kubectl create secret generic rizer001-env --from-env-file=.env -n rizer001-site
  DATABASE_URL: "file:/app/data/dev.db"
  NEXTAUTH_SECRET: "CHANGE_ME"
  NEXTAUTH_URL: "https://rizer001.opik.net"
  # Add remaining keys from .env as needed
