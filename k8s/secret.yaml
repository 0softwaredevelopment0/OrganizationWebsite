apiVersion: v1
kind: Secret
metadata:
  name: rizer001-env
  namespace: rizer001-site
type: Opaque
stringData:
  # ⚠ TEMPLATE ONLY — do NOT `kubectl apply -f` this file: it would clobber the
  # live secret (real NEXTAUTH_SECRET etc.). The live secret is patched
  # in place; DATABASE_URL on the server lives in /opt/websites/rizer001-site/.env
  # (postgresql://rizer001:***@127.0.0.1:5432/rizer001_site).
  DATABASE_URL: "postgresql://rizer001:PASSWORD@127.0.0.1:5432/rizer001_site"
  NEXTAUTH_SECRET: "CHANGE_ME"
  NEXTAUTH_URL: "https://rizer001.opik.net"
  # Add remaining keys from .env as needed
